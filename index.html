
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS Movie Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090910;color:white;font-family:Arial,sans-serif}
header{padding:22px 5%;background:#151520;border-bottom:2px solid #ff3150}
.logo{font-size:32px;font-weight:900;letter-spacing:3px;color:#ff3150}
main{max-width:1200px;margin:auto;padding:24px 5%}
.hero{padding:25px;background:linear-gradient(120deg,#40142c,#19192e);border-radius:15px}
h1{font-size:38px}
input,select{width:100%;padding:13px;margin:8px 0;background:#191923;color:white;border:1px solid #444459;border-radius:9px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.card{background:#171722;border:1px solid #303044;border-radius:12px;padding:14px}
.icon{font-size:32px}
.card h3{font-size:15px;min-height:38px}
.category{font-size:12px;color:#aaaabd;margin-bottom:12px}
button{background:#ff3150;color:white;border:0;border-radius:8px;padding:12px 8px;width:100%;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#player{display:none;margin:20px 0;background:#171722;padding:14px;border-radius:12px}
iframe{width:100%;aspect-ratio:16/9;border:0;background:black}
.note{color:#aaaabd;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header><div class="logo">NEXUS.</div><div>YOUR MOVIE UNIVERSE</div></header>
<main>
<section class="hero">
<h1>PRESS PLAY.</h1>
<p>Marvel · Spider-Man · Sonic · Transformers · Comedy · Action · Gaming · Animation</p>
</section>

<h2>Movie Collection</h2>
<input id="search" placeholder="Search movies..." oninput="render()">
<select id="filter" onchange="render()">
<option>All</option><option>Marvel</option><option>Action</option>
<option>Comedy</option><option>Sci-Fi</option><option>Animation</option>
<option>Gaming</option><option>Adventure</option>
</select>

<div id="player">
<h2 id="playing"></h2>
<iframe id="video" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
</div>
<div id="movies" class="grid"></div>
<p class="note">Only movies with verified, authorized full-film video sources can play here. A title alone does not provide a video stream.</p>
</main>

<script>
const titles = [
["The Avengers","Marvel","🦸"],["Avengers: Age of Ultron","Marvel","🦸"],
["Avengers: Infinity War","Marvel","🦸"],["Avengers: Endgame","Marvel","🦸"],
["Iron Man","Marvel","🤖"],["Iron Man 2","Marvel","🤖"],["Iron Man 3","Marvel","🤖"],
["Black Panther","Marvel","🐾"],["Thor: Ragnarok","Marvel","⚡"],
["Guardians of the Galaxy","Marvel","🚀"],["Doctor Strange","Marvel","✨"],
["Spider-Man","Action","🕷️"],["Spider-Man 2","Action","🕷️"],
["Spider-Man 3","Action","🕷️"],["The Amazing Spider-Man","Action","🕸️"],
["Spider-Man: Homecoming","Marvel","🕷️"],["Spider-Man: No Way Home","Marvel","🕷️"],
["Into the Spider-Verse","Animation","🕸️"],["Across the Spider-Verse","Animation","🕸️"],
["Transformers","Action","🤖"],["Bumblebee","Action","🚗"],
["Transformers: Rise of the Beasts","Action","🤖"],
["Sonic the Hedgehog","Gaming","💙"],["Sonic the Hedgehog 2","Gaming","💙"],
["Sonic the Hedgehog 3","Gaming","💙"],["The Super Mario Bros. Movie","Gaming","🍄"],
["A Minecraft Movie","Gaming","⛏️"],["Detective Pikachu","Gaming","⚡"],
["Free Guy","Comedy","🎮"],["Jumanji","Adventure","🌴"],
["Uncharted","Adventure","🗺️"],["The LEGO Movie","Animation","🧱"],
["Shrek","Animation","🟢"],["Kung Fu Panda","Animation","🐼"],
["Puss in Boots: The Last Wish","Animation","🐱"],
["The Incredibles","Animation","🦸"],["Toy Story","Animation","🤠"],
["Finding Nemo","Animation","🐠"],["Cars","Animation","🏎️"],
["Despicable Me","Animation","🍌"],["Wreck-It Ralph","Animation","🎮"],
["The Batman","Action","🦇"],["The Dark Knight","Action","🦇"],
["Fast Five","Action","🏎️"],["Top Gun: Maverick","Action","✈️"],
["John Wick","Action","🎯"],["Jurassic Park","Adventure","🦖"],
["Jurassic World","Adventure","🦖"],["Godzilla vs. Kong","Sci-Fi","🦖"],
["Pacific Rim","Sci-Fi","🤖"],["Avatar","Sci-Fi","🌌"],
["Interstellar","Sci-Fi","🚀"],["Ready Player One","Sci-Fi","🎮"],
["The Matrix","Sci-Fi","💊"],["Back to the Future","Sci-Fi","⏰"],
["Men in Black","Sci-Fi","👽"],["Ghostbusters","Comedy","👻"],
["Rush Hour","Comedy","😂"],["Home Alone","Comedy","🏠"],
["Night at the Museum","Comedy","🦕"],["The Mask","Comedy","🎭"]
];

// Add a movie's authorized, embeddable full-film URL here
// only after verifying the source permits full-film playback.
const playableSources = {};

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const f=document.getElementById("filter").value;
 const list=titles.filter(m=>
   m[0].toLowerCase().includes(q)&&(f==="All"||m[1]===f)
 );
 document.getElementById("movies").innerHTML=list.map(m=>{
   const url=playableSources[m[0]];
   return `<article class="card">
    <div class="icon">${m[2]}</div>
    <h3>${m[0]}</h3>
    <div class="category">${m[1]}</div>
    <button ${url?'':'disabled'} onclick="playMovie('${encodeURIComponent(m[0])}')">PRESS PLAY — WATCH NOW</button>
   </article>`;
 }).join("");
}

function playMovie(encodedTitle){
 const title=decodeURIComponent(encodedTitle);
 const url=playableSources[title];
 if(!url)return;
 document.getElementById("playing").textContent=title;
 document.getElementById("video").src=url;
 document.getElementById("player").style.display="block";
 document.getElementById("player").scrollIntoView({behavior:"smooth"});
}
render();
</script>
</body>
</html>
