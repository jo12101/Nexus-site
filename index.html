a:hover{background:#6d28d9}
.note{color:#aaa;font-size:12px;line-height:1.6;margin-top:25px}

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const g=document.getElementById("genre").value;
 const list=movies.filter(m=>
  m[0].toLowerCase().includes(q)&&(g==="All"||m[1]===g)
 );
 document.getElementById("count").textContent=
  `${list.length} movies shown · ${movies.length} listings`;
 document.getElementById("grid").innerHTML=list.map(m=>`
 <article class="card">
  <div class="poster">${m[2]}</div>
  <div class="info">
   <h3>${m[0]}</h3>
   <div class="tag">${m[1]}</div>
   <a target="_blank" rel="noopener noreferrer"
      href="https://www.justwatch.com/us/search?q=${encodeURIComponent(m[0])}">
      Find legal viewing options ↗
   </a>
  </div>
 </article>`).join("")||"<p>No movies found. Try another search.</p>";
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("genre").addEventListener("change",render);
render();
